; ==========================================================================
; Phototripper configuration file
; ==========================================================================
;
; Settings are resolved in this order (first found wins):
;   CLI arguments  >  [module] section  >  [common] section  >  hardcoded defaults
;
; Config file lookup order (first file found is used):
;   1. ./phototripper.ini          (current working directory)
;   2. $HOME/phototripper.ini
;   3. $HOME/.config/phototripper.ini
;   4. $PHOTOTRIPPER_CONFIG/phototripper.ini
;
; Uncomment and edit settings as needed.

[common]
; Shared settings across all subcommands.
; These can be overridden per-module in sections below.

; search-dir = ~/Photos
; verbose = false
; dry-run = false
; summary = false

[google]
; Google Maps API key used for geocoding and Places lookups.
; If not set here, phototripper falls back to the legacy
; .pyscripts-google.ini config file.

; api-key = YOUR_KEY_HERE

[sort]
; Settings specific to the 'sort' subcommand.
; Any key here overrides the same key in [common].

; search-radius = 3000
; rename-format = {day} - {place}/IMG_{datetime:extended}_{sequence}
; recursive = false
; rename-only = false
; skip-location = false
; debug = false

[gpx]
; Settings specific to the 'gpx' subcommand, which writes GPS coordinates
; onto pictures by matching their shooting time against a GPS track.
;
; The track is mandatory: give a .gpx file, a comma separated list of them,
; or a folder holding them. A folder is never searched recursively.
; track = ~/tracks/holiday.gpx

; How far apart two track points may be for a picture between them to be
; placed, and how far beyond either end of the track to reach. Both default
; to exiftool's own 1800 seconds. Leave them unset: gpx reports the exact
; value each shoot needs, and you set it only when you agree with it.
; max-int-secs = 1800
; max-ext-secs = 1800

; Correct a camera clock that runs off, as exiftool's -geosync.
; geosync = -00:01:30

; Write an XMP sidecar next to each picture instead of the RAW itself.
; sidecar = false

; Pictures that already carry coordinates, or already have a sidecar, are
; left alone. Turn this on to replace them.
; overwrite-gps = false

; gpx checks the camera's UTC offset against the time zone of the place the
; track puts you in, to catch a forgotten daylight saving switch.
; skip-dst-check = false
